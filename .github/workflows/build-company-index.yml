name: Build company index

# Companies House publishes Basic Company Data within 5 working days of month
# end. Check daily from the 5th to the 12th; the script skips snapshots that are
# already published, so the index is rebuilt once a month.
on:
  schedule:
    - cron: '0 6 5-12 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-company-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build and publish the latest snapshot to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          # About 3 GB of memory is needed for 5+ million companies.
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          if [ -z "$R2_BUCKET" ]; then
            echo "::notice::R2 secrets are not set yet; skipping the build."
            exit 0
          fi
          node scripts/import/build-index.ts --latest --upload --skip-if-imported --summary data/last-import.json

      # Committing the summary records each build and counts as repository
      # activity, which stops GitHub disabling this scheduled workflow after
      # 60 quiet days.
      - name: Commit the build summary
        run: |
          if git diff --quiet -- data/last-import.json; then
            echo "No new snapshot"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/last-import.json
          git commit -m "Company index: snapshot $(jq -r .snapshot data/last-import.json)"
          git push
